<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aegis-Scryer: an emotion-reactive magic mirror. All perception runs in your browser.">
  <title>AEGIS SCRYER</title>
  <link rel="icon" type="image/svg+xml" href="/scryer_icon.svg">
  <link rel="stylesheet" href="/src/styles/theme.css">
</head>
<body>

  <!-- Temple frame: corner brackets around the whole viewport -->
  <div class="hud-frame" aria-hidden="true"></div>

  <nav id="temple-nav" aria-label="Temple navigation">
    <a class="nav-brand" href="#/home">
      <img src="/Scryer_Eye_Orb.webp" alt="" width="52" height="52">
      <span>SCRYER</span>
    </a>
    <div class="nav-links">
      <a href="#/home" data-route="/home"><span class="nav-ico" aria-hidden="true">◈</span><span class="nav-txt"><b>HOME</b><small>the threshold</small></span></a>
      <a href="#/eye" data-route="/eye"><span class="nav-ico" aria-hidden="true">◉</span><span class="nav-txt"><b>ORB EYE</b><small>fractal oracle</small></span></a>
      <a href="#/kaleidoscope" data-route="/kaleidoscope"><span class="nav-ico" aria-hidden="true">✦</span><span class="nav-txt"><b>KALEIDOSCOPE</b><small>soul light</small></span></a>
      <a href="#/mirror" data-route="/mirror"><span class="nav-ico" aria-hidden="true">◇</span><span class="nav-txt"><b>MAGIC MIRROR</b><small>face constellation</small></span></a>
      <a href="#/chaseme" data-route="/chaseme"><span class="nav-ico" aria-hidden="true">➤</span><span class="nav-txt"><b>CHASE ME</b><small>gaze pursuit</small></span></a>
      <a href="#/life" data-route="/life"><span class="nav-ico" aria-hidden="true">▦</span><span class="nav-txt"><b>GAME OF LIFE</b><small>living cells</small></span></a>
    </div>
    <div class="nav-foot">
      <span id="nav-status">DORMANT</span>
    </div>
  </nav>

  <!-- Pages mount and unmount inside this container -->
  <main id="page" tabindex="-1"></main>

  <!-- MediaPipe CDN globals (FaceMesh, Hands, Camera) + onnxruntime-web (ort)
       + the neural emotion net. These are CLASSIC scripts (no type/async/defer)
       so they execute during parse and finish BEFORE the deferred ES module
       below — that is what guarantees window.FaceMesh/Hands/Camera/ort exist
       by the time any page module (e.g. core/camera.js) runs, and that the
       emotion IIFE is live. Do NOT add async/defer or move them after the
       module. (These can later be vendored under /public/mediapipe if you want
       to drop the CDN; keep them classic either way.) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <!-- Pure IIFE (no ES imports): runs continuously and no-ops through
       window.Scryer?.* until the Eye page installs the bridge. -->
  <!-- Optional remote model URL (e.g. S3/CloudFront). Vite substitutes
       %VITE_MODEL_URL% at build time; unset, emotions.js falls back to /models/. -->
  <script>window.SCRYER_MODEL_URL = "%VITE_MODEL_URL%";</script>
  <script src="/emotions.js"></script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
